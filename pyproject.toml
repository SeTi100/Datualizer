[project]
name = "datualizer"
version = "0.1.0"
description = "High-Performance Tidy Data Wrangling & Visualization Framework for Sensor & Engineering Data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pyside6>=6.6.0,<6.12",  # 6.12.0 aborts the GUI tests (refcount bug, "deallocating None")
    "pyqtgraph>=0.13.3",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.gui-scripts]
datualizer = "datualizer_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datualizer_core", "datualizer_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
