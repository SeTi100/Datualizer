[project]
name = "datualizer"
version = "0.1.0"
description = "High-Performance Tidy Data Wrangling & Visualization Framework for Sensor & Engineering Data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pyside6>=6.6.0,<6.12",  # 6.12.0 aborts the GUI tests (refcount bug, "deallocating None")
    "pyqtgraph>=0.14",  # tested version for the fast curves (datualizer_gui/components/curves.py)
    "pydantic>=2.0.0",
    "openpyxl>=3.1",  # .xlsx sources (lab journal, device exports)
    "xlrd>=2.0",  # legacy .xls sources (BIFF), e.g. analyzer exports
    "tzdata; sys_platform == 'win32'",  # zone database for time-zone-aware datetimes on Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.gui-scripts]
datualizer = "datualizer_gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datualizer_core", "datualizer_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
